name: DV11 release gates

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run benchmark:dv11:leakage
      - run: npm run dv11:validate-packages
      - run: npm run dv11:validate-service-data
      - run: npm run build
      - run: npm run budget:dv11
      - run: npm run test:unit
